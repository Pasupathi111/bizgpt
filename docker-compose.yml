# BizGPT stack. Open WebUI runs from the official image; our code lives in ./owui
# and is pushed in with scripts/sync.py. Upgrading = change OWUI_VERSION in .env.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OWUI_VERSION:-v0.11.4}
    container_name: bizgpt-webui
    restart: unless-stopped
    ports:
      - "${OWUI_PORT:-3000}:8080"
    env_file: .env
    environment:
      # Lets the container reach a Dify running on the Docker host (local testing).
      - ENABLE_API_KEYS=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bizgpt-webui-data:/app/backend/data

volumes:
  bizgpt-webui-data:
