# BizGPT stack. Biz GPT runs from the official image; our code lives in ./owui
# and is pushed in with scripts/sync.py. Upgrading = change OPEN_WEBUI_VERSION in .env.
services:
  open-webui:
    build:
      context: ./open-webui
      args:
        BUILD_HASH: bizgpt-subpath
    image: bizgpt-open-webui:local
    container_name: bizgpt-webui
    networks:
      - default
      - dify
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    env_file: .env
    environment:
      - ENABLE_API_KEYS=true
      - TOOL_SERVER_CONNECTIONS=${TOOL_SERVER_CONNECTIONS:-[]}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bizgpt-webui-data:/app/backend/data
    depends_on:
      - bizgpt-forms
      - bizgpt-integrations
      - nango-server

  nango-db:
    image: postgres:16.0-alpine
    container_name: nango-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${NANGO_DB_USER:-nango}
      - POSTGRES_PASSWORD=${NANGO_DB_PASSWORD:-nango}
      - POSTGRES_DB=${NANGO_DB_NAME:-nango}
    volumes:
      - nango-db-data:/var/lib/postgresql/data

  nango-redis:
    image: redis:7.2.4
    container_name: nango-redis
    restart: unless-stopped

  nango-server:
    image: nangohq/nango-server:${NANGO_VERSION:-hosted-0.71.10}
    container_name: nango-server
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "127.0.0.1:${NANGO_SERVER_PORT:-3003}:3003"
      - "127.0.0.1:${NANGO_CONNECT_UI_PORT:-3009}:3009"
    environment:
      - NANGO_ENCRYPTION_KEY=${NANGO_ENCRYPTION_KEY:?set NANGO_ENCRYPTION_KEY in .env}
      - NANGO_ADMIN_KEY=${NANGO_ADMIN_KEY:?set NANGO_ADMIN_KEY in .env}
      - NANGO_DB_USER=${NANGO_DB_USER:-nango}
      - NANGO_DB_PASSWORD=${NANGO_DB_PASSWORD:-nango}
      - NANGO_DB_HOST=nango-db
      - NANGO_DB_NAME=${NANGO_DB_NAME:-nango}
      - RECORDS_DATABASE_URL=postgresql://${NANGO_DB_USER:-nango}:${NANGO_DB_PASSWORD:-nango}@nango-db:5432/${NANGO_DB_NAME:-nango}
      - PORT=3003
      - SERVER_PORT=3003
      - NANGO_SERVER_URL=${NANGO_SERVER_URL:-http://localhost:3003}
      - NANGO_PUBLIC_SERVER_URL=${NANGO_PUBLIC_SERVER_URL:-http://localhost:3003}
      - NANGO_PUBLIC_CONNECT_URL=${NANGO_PUBLIC_CONNECT_URL:-http://localhost:3009}
      - NANGO_SECRET_KEY_DEV=${NANGO_SECRET_KEY:?set NANGO_SECRET_KEY in .env}
      - FLAG_SERVE_CONNECT_UI=true
      - FLAG_AUTH_ENABLED=true
      - NANGO_DASHBOARD_USERNAME=${NANGO_DASHBOARD_USERNAME:-admin}
      - NANGO_DASHBOARD_PASSWORD=${NANGO_DASHBOARD_PASSWORD:?set NANGO_DASHBOARD_PASSWORD in .env}
      - LOG_LEVEL=info
    depends_on:
      - nango-db
      - nango-redis

  bizgpt-forms:
    build: ./services/forms
    image: bizgpt-forms:local
    container_name: bizgpt-forms
    networks:
      - default
      - dify
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORMS_PORT:-8090}:8000"
    environment:
      - FORMS_API_KEY=${FORMS_API_KEY:?set FORMS_API_KEY in .env}
      - FORMS_PUBLIC_URL=${FORMS_PUBLIC_URL:-http://localhost:8090}
      - FORMS_FRAME_ANCESTORS=${FORMS_FRAME_ANCESTORS:-http://localhost:3000}
      - DIFY_BASE_URL=${DIFY_BASE_URL:-}
      - DIFY_APPS=${DIFY_APPS:-[]}
      - DIFY_WORKFLOW_LEAD_QUALIFIER_KEY=${DIFY_WORKFLOW_LEAD_QUALIFIER_KEY:-}
      - DIFY_WORKFLOW_COMPANY_LEAD_GENERATION_KEY=${DIFY_WORKFLOW_COMPANY_LEAD_GENERATION_KEY:-}
      - DIFY_WORKFLOW_LEAVE_REQUEST_KEY=${DIFY_WORKFLOW_LEAVE_REQUEST_KEY:-}
      - DIFY_WORKFLOW_IT_SUPPORT_KEY=${DIFY_WORKFLOW_IT_SUPPORT_KEY:-}
      - DIFY_WORKFLOW_PURCHASE_REQUEST_KEY=${DIFY_WORKFLOW_PURCHASE_REQUEST_KEY:-}
    volumes:
      - ./config/forms:/config/forms:ro
      - bizgpt-forms-data:/data
    depends_on:
      - bizgpt-automation

  bizgpt-integrations:
    build: ./services/integrations
    image: bizgpt-integrations:local
    container_name: bizgpt-integrations
    networks:
      - default
      - dify  # reaches the gmail_mcp container (fallback sender for /api/emails/send)
    restart: unless-stopped
    ports:
      - "127.0.0.1:${INTEGRATIONS_PORT:-8092}:8002"
    environment:
      - INTEGRATIONS_API_KEY=${INTEGRATIONS_API_KEY:?set INTEGRATIONS_API_KEY in .env}
      - INTEGRATIONS_PUBLIC_URL=${INTEGRATIONS_PUBLIC_URL:-http://localhost:8092}
      - NANGO_SERVER_URL=http://nango-server:3003
      - NANGO_PUBLIC_SERVER_URL=${NANGO_PUBLIC_SERVER_URL:-http://localhost:3003}
      - NANGO_PUBLIC_CONNECT_URL=${NANGO_PUBLIC_CONNECT_URL:-http://localhost:3009}
      - NANGO_SECRET_KEY=${NANGO_SECRET_KEY:-}
      - NANGO_ENV=${NANGO_ENV:-dev}
      - NANGO_GMAIL_CONFIG_KEY=${NANGO_GMAIL_CONFIG_KEY:-gmail}
      - NANGO_OUTLOOK_CONFIG_KEY=${NANGO_OUTLOOK_CONFIG_KEY:-outlook}
      - GOOGLE_CLOUD_PROJECT_ID=${GOOGLE_CLOUD_PROJECT_ID:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GMAIL_MCP_URL=${INTEGRATIONS_GMAIL_MCP_URL:-http://gmail_mcp:8010/mcp}
      - GMAIL_MCP_MAILBOX=${INTEGRATIONS_GMAIL_MCP_MAILBOX:-dbizgpt.assistant@gmail.com}
    depends_on:
      - nango-server

  bizgpt-api:
    build: ./services/api
    image: bizgpt-api:local
    container_name: bizgpt-api
    networks:
      - default
      - dify
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BIZGPT_API_PORT:-8093}:8003"
    environment:
      - WORKFLOWS_CONFIG_PATH=/config/workflows.yaml
      - WORKFLOW_STUDIO_DIR=/config/workflow-studio
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-http://localhost:3000,http://localhost:8093}
      - FORMS_API_URL=http://bizgpt-forms:8000
      - FORMS_API_KEY=${FORMS_API_KEY:?set FORMS_API_KEY in .env}
      - INTEGRATIONS_API_URL=http://bizgpt-integrations:8002
      - INTEGRATIONS_API_KEY=${INTEGRATIONS_API_KEY:?set INTEGRATIONS_API_KEY in .env}
      - DIFY_BASE_URL=${DIFY_BASE_URL:-}
      - DIFY_APPS=${DIFY_APPS:-[]}
      - DIFY_WORKFLOW_LEAD_QUALIFIER_KEY=${DIFY_WORKFLOW_LEAD_QUALIFIER_KEY:-}
      - DIFY_WORKFLOW_COMPANY_LEAD_GENERATION_KEY=${DIFY_WORKFLOW_COMPANY_LEAD_GENERATION_KEY:-}
      - DIFY_WORKFLOW_LEAVE_REQUEST_KEY=${DIFY_WORKFLOW_LEAVE_REQUEST_KEY:-}
      - DIFY_WORKFLOW_IT_SUPPORT_KEY=${DIFY_WORKFLOW_IT_SUPPORT_KEY:-}
      - DIFY_WORKFLOW_PURCHASE_REQUEST_KEY=${DIFY_WORKFLOW_PURCHASE_REQUEST_KEY:-}
    volumes:
      - ./config/workflows.yaml:/config/workflows.yaml:ro
      - ./config/workflow-studio:/config/workflow-studio:ro
      - bizgpt-api-data:/data
    depends_on:
      - bizgpt-forms
      - bizgpt-integrations

  bizgpt-automation:
    build: ./services/automation
    image: bizgpt-automation:local
    container_name: bizgpt-automation
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUTOMATION_PORT:-8091}:8001"
    environment:
      - AUTOMATION_PUBLIC_URL=${AUTOMATION_PUBLIC_URL:-http://localhost:8091}
    volumes:
      - bizgpt-automation-data:/data

  # WhatsApp channel: Meta Cloud API webhook -> Biz GPT agent -> reply. See services/whatsapp/README.md.
  # Only /api/whatsapp/webhook should be published through the reverse proxy.
  bizgpt-whatsapp:
    build: ./services/whatsapp
    image: bizgpt-whatsapp:local
    container_name: bizgpt-whatsapp
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WHATSAPP_PORT:-8104}:8001"
    environment:
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:-}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION:-v23.0}
      - OPENWEBUI_BASE_URL=http://open-webui:8080
      - OPENWEBUI_API_KEY=${WHATSAPP_OPENWEBUI_API_KEY:-}
      - WHATSAPP_AGENT_MODEL=${WHATSAPP_AGENT_MODEL:-bizgpt-whatsapp}
      - WHATSAPP_SERVICE_API_KEY=${WHATSAPP_SERVICE_API_KEY:-}
      - DATABASE_URL=postgresql+asyncpg://${WHATSAPP_DB_USER:-whatsapp}:${WHATSAPP_DB_PASSWORD:-whatsapp}@whatsapp-db:5432/${WHATSAPP_DB_NAME:-whatsapp}
    depends_on:
      whatsapp-db:
        condition: service_healthy

  # Email-driven T-shirt order workflow (Biz Inbox > Orders). Reads and sends mail through gmail_mcp.
  bizgpt-orders:
    build: ./services/orders
    image: bizgpt-orders:local
    container_name: bizgpt-orders
    networks:
      - default
      - dify
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ORDERS_PORT:-8105}:8000"
    environment:
      - GMAIL_MCP_URL=${ORDERS_GMAIL_MCP_URL:-http://gmail_mcp:8010/mcp}
      - ORDERS_MAILBOX=${ORDERS_MAILBOX:-dbizgpt.assistant@gmail.com}
      - ORDERS_MODEL=${BIZGPT_BASE_MODEL:-gpt-4.1-mini}
      - ORDERS_POLL_SECONDS=${ORDERS_POLL_SECONDS:-60}
      - ORDERS_POLLING_ENABLED=${ORDERS_POLLING_ENABLED:-true}
      - OPENWEBUI_BASE_URL=http://open-webui:8080
      - OPENWEBUI_API_KEY=${OPEN_WEBUI_API_KEY:-}
      - FORMS_API_URL=http://bizgpt-forms:8000
      - FORMS_API_KEY=${FORMS_API_KEY:?set FORMS_API_KEY in .env}
    volumes:
      - bizgpt-orders-data:/data
    depends_on:
      - bizgpt-forms

  whatsapp-db:
    image: postgres:16-alpine
    container_name: bizgpt-whatsapp-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${WHATSAPP_DB_USER:-whatsapp}
      - POSTGRES_PASSWORD=${WHATSAPP_DB_PASSWORD:-whatsapp}
      - POSTGRES_DB=${WHATSAPP_DB_NAME:-whatsapp}
    volumes:
      - whatsapp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WHATSAPP_DB_USER:-whatsapp}"]
      interval: 5s
      timeout: 3s
      retries: 10


  # AI-Assisted Monthly Report Delivery (POC): photos -> vision AI -> grouping/validation -> review -> PDF.
  # Isolated from the other projects; uses only the monthly-report-vision model.
  bizgpt-monthly-report:
    build: ./services/monthly-report
    image: bizgpt-monthly-report:local
    container_name: bizgpt-monthly-report
    networks:
      - default
      - dify  # reaches the gmail_mcp container for the Gmail photo intake
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONTHLY_REPORT_PORT:-8106}:8000"
    environment:
      - OPENWEBUI_BASE_URL=http://open-webui:8080
      - MONTHLY_REPORT_MODEL=${MONTHLY_REPORT_MODEL:-monthly-report-vision}
      - MONTHLY_REPORT_CONFIDENCE_THRESHOLD=${MONTHLY_REPORT_CONFIDENCE_THRESHOLD:-75}
      - MONTHLY_REPORT_MODEL_TIMEOUT=${MONTHLY_REPORT_MODEL_TIMEOUT:-240}
      - MONTHLY_REPORT_GMAIL_MCP_URL=${MONTHLY_REPORT_GMAIL_MCP_URL:-http://gmail_mcp:8010/mcp}
      - MONTHLY_REPORT_MAILBOX=${MONTHLY_REPORT_MAILBOX:-dbizgpt.assistant@gmail.com}
      - MONTHLY_REPORT_GMAIL_QUERY=${MONTHLY_REPORT_GMAIL_QUERY:-}
      # Automatic mailbox check every N seconds (0 = only when asked in chat / on the page).
      # Needs a Biz GPT API key so the model can be called without a signed-in user.
      - MONTHLY_REPORT_GMAIL_POLL_SECONDS=${MONTHLY_REPORT_GMAIL_POLL_SECONDS:-0}
      - MONTHLY_REPORT_OPENWEBUI_API_KEY=${MONTHLY_REPORT_OPENWEBUI_API_KEY:-}
    volumes:
      - ./config/monthly-report:/config:ro
      - bizgpt-monthly-report-data:/data
volumes:
  bizgpt-monthly-report-data:
  whatsapp-db-data:
  bizgpt-api-data:
  bizgpt-webui-data:
  bizgpt-forms-data:
  bizgpt-orders-data:
  bizgpt-automation-data:
  nango-db-data:

networks:
  # Shared with the self-hosted Dify stack and the gmail_mcp container.
  dify:
    external: true
    name: dify_default
