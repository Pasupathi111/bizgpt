# Add inside the HTTPS server block of test.gpt.dbizlab.com, before "location /".
    # ---- Inbox Zero (self-hosted, built with Next.js basePath=/inbox_zero) ----
    location ^~ /inbox_zero {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $inbox_zero_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
        # Same-origin framing for the Biz GPT /inbox page (other sites stay blocked).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy $inbox_zero_csp always;
    }
    # Inbox Zero public assets referenced without the base path (Biz GPT does not use these paths).
    location ~ ^/(images|icons|splash_screens)/ {
        rewrite ^ /inbox_zero$uri break;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
    }

