# WebSocket upgrade map for Inbox Zero at https://test.gpt.dbizlab.com/inbox_zero
map $http_upgrade $inbox_zero_connection_upgrade {
    default upgrade;
    ''      close;
}

# Allow Inbox Zero to be framed by Biz GPT on the same origin only:
# keep its CSP but swap frame-ancestors 'none' -> 'self'.
map $upstream_http_content_security_policy $inbox_zero_csp {
    "~^(?<iz_csp_pre>.*)frame-ancestors 'none'(?<iz_csp_post>.*)$" "${iz_csp_pre}frame-ancestors 'self'${iz_csp_post}";
    default $upstream_http_content_security_policy;
}
