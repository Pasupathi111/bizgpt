# Add inside the HTTPS server block of your Biz GPT host (e.g. test.gpt.dbizlab.com), before "location /".
# Publishes ONLY the Meta webhook. The rest of the WhatsApp service API stays on 127.0.0.1.
# Meta callback URL: https://<your-host>/api/whatsapp/webhook
    location = /api/whatsapp/webhook {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8104;   # host port = WHATSAPP_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }
