# Standalone WhatsApp integration stack (service + its own PostgreSQL).
#   cp .env.example .env   # fill in the Meta + Biz GPT values
#   docker compose up -d --build
# Inside the main Biz GPT stack, the root docker-compose.yml runs the same service.
services:
  whatsapp:
    build: .
    image: bizgpt-whatsapp:local
    container_name: bizgpt-whatsapp
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${WHATSAPP_DB_USER:-whatsapp}:${WHATSAPP_DB_PASSWORD:-whatsapp}@whatsapp-db:5432/${WHATSAPP_DB_NAME:-whatsapp}
    ports:
      - "127.0.0.1:${WHATSAPP_PORT:-8104}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      whatsapp-db:
        condition: service_healthy

  whatsapp-db:
    image: postgres:16-alpine
    container_name: bizgpt-whatsapp-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${WHATSAPP_DB_USER:-whatsapp}
      - POSTGRES_PASSWORD=${WHATSAPP_DB_PASSWORD:-whatsapp}
      - POSTGRES_DB=${WHATSAPP_DB_NAME:-whatsapp}
    volumes:
      - whatsapp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WHATSAPP_DB_USER:-whatsapp}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  whatsapp-db-data:
